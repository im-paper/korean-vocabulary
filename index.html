<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 어휘장</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1 id="site-title">나의 어휘장</h1>
    <p id="site-subtitle" class="subtitle">국립국어원 표준국어대사전 기준</p>
  </header>

  <div id="track-tabs" class="track-tabs" role="tablist" aria-label="어휘장 종류">
    <button type="button" class="track-tab active" data-track="daily" role="tab">일일 어휘</button>
    <button type="button" class="track-tab" data-track="book" role="tab">책별 어휘</button>
  </div>

  <nav id="day-nav" class="day-nav" aria-label="세트 선택"></nav>

  <main id="content" class="content"></main>

  <footer class="site-footer">
    <p>뜻과 예문은 국립국어원 표준국어대사전을 기준으로 작성됩니다.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
